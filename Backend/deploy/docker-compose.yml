services:
  postgres_auth:
    image: postgres:14
    container_name: postgres_auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymbro_auth
    volumes:
      - pg_auth_data:/var/lib/postgresql/data

  auth_service:
    build:
      context: ..
      dockerfile: deploy/auth.Dockerfile
    container_name: auth_service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres_auth:5432/gymbro_auth?sslmode=disable"
      JWT_SECRET: "supersecret_noone_will_get_out"
      PGHOST: postgres_auth
      PGPORT: 5432
    depends_on:
      - postgres_auth
    expose:
      - "8081"

  postgres_workouts:
    image: postgres:14
    container_name: postgres_workouts
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymbro_workouts
    volumes:
      - pg_workouts_data:/var/lib/postgresql/data

  workouts_service:
    build:
      context: ..
      dockerfile: deploy/workouts.Dockerfile
    container_name: workouts_service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres_workouts:5432/gymbro_workouts?sslmode=disable"
      JWT_SECRET: "supersecret_noone_will_get_out"
      BDUI_M2M_JWT_PUBLIC_KEY_PEM: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAr2waTUd13AIxI4Qr/elx
        usb4c/WzDW9PFWaazvKTBwZt6OjOOF2bH66+0EGgoITW+MBNfBcet+3HFFWkrJU6
        njib0ZW9tyeNa7Cs+AQe7gKs8K71ALeibQFOsYpQdW94p02MEDn/N5kAK7tSur5C
        5plTekXFuX+ccUGtp4NcgSWTvlHumV/g55BuY39fPtRSyPVAAGW3WtasjnvEqpLs
        pQqWZ5VTYVGdQfbjKuWT0Rn0Jt3wUkGJUVXTKYw33foV8oMPpWjSuxuUA+N+VYrJ
        r4oubb+A7lNzTR0kaaS+ciqa22v2vzu4vrskYnEWCtQ4VdALdqx18H6/kTGCicbv
        eQIDAQAB
        -----END PUBLIC KEY-----
      PROFILE_SERVICE_URL: "http://profile_service:8084"
      INTERNAL_SERVICE_SECRET: "internal_service_shared_secret_change_me"
      PGHOST: postgres_workouts
      PGPORT: 5432
    depends_on:
      - postgres_workouts
    expose:
      - "8082"

  postgres_feeds:
    image: postgres:14
    container_name: postgres_feeds
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymbro_feeds
    volumes:
      - pg_feeds_data:/var/lib/postgresql/data

  feeds_service:
    build:
      context: ..
      dockerfile: deploy/feeds.Dockerfile
    container_name: feeds_service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres_feeds:5432/gymbro_feeds?sslmode=disable"
      JWT_SECRET: "supersecret_noone_will_get_out"
      WORKOUTS_SERVICE_URL: "http://workouts_service:8082"
      PROFILE_SERVICE_URL: "http://profile_service:8084"
      PGHOST: postgres_feeds
      PGPORT: 5432
    depends_on:
      - postgres_feeds
    expose:
      - "8083"
  
  postgres_profile:
    image: postgres:14
    container_name: postgres_profile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymbro_profile
    volumes:
      - pg_profile_data:/var/lib/postgresql/data

  profile_service:
    build:
      context: ..
      dockerfile: deploy/profile.Dockerfile
    container_name: profile_service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres_profile:5432/gymbro_profile?sslmode=disable"
      JWT_SECRET: "supersecret_noone_will_get_out"
      INTERNAL_SERVICE_SECRET: "internal_service_shared_secret_change_me"
      FEEDS_SERVICE_URL: "http://feeds_service:8083"
      WORKOUTS_SERVICE_URL: "http://workouts_service:8082"
      PGHOST: postgres_profile
      PGPORT: 5432
    depends_on:
      - postgres_profile
      - feeds_service
      - workouts_service
    expose:
      - "8084"

  ai_service:
    build:
      context: ../services/ai_service
      dockerfile: Dockerfile
    container_name: ai_service
    environment:
      JWT_SECRET: "supersecret_noone_will_get_out"
      LLAMA_N_THREADS: "4"
    expose:
      - "8085"
    mem_limit: "8g"
    memswap_limit: "8g"

  postgres_analytics:
    image: postgres:14
    container_name: postgres_analytics
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymbro_analytics
    volumes:
      - pg_analytics_data:/var/lib/postgresql/data

  analytics_service:
    build:
      context: ..
      dockerfile: deploy/analytics.Dockerfile
    container_name: analytics_service
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres_analytics:5432/gymbro_analytics?sslmode=disable"
      JWT_SECRET: "supersecret_noone_will_get_out"
      PGHOST: postgres_analytics
      PGPORT: 5432
    depends_on:
      - postgres_analytics
    expose:
      - "8086"

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    container_name: gateway
    environment:
      AUTH_URL: "http://auth_service:8081"
      WORKOUTS_URL: "http://workouts_service:8082"
      FEEDS_URL: "http://feeds_service:8083"
      PROFILE_URL: "http://profile_service:8084"
      AI_URL: "http://ai_service:8085"
      ANALYTICS_URL: "http://analytics_service:8086"
    depends_on:
      - auth_service
      - workouts_service
      - feeds_service
      - profile_service
      - ai_service
      - analytics_service
    ports:
      - "8080:8080"

volumes:
  pg_auth_data:
  pg_workouts_data:
  pg_feeds_data:
  pg_profile_data:
  pg_analytics_data:
