name: DivKit CI

on:
  push:
    paths:
      - 'DivKit/**'
  pull_request:

jobs:
  test:
    name: Kotlin / Gradle tests — DivKit backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DivKit/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
          cache: gradle
          cache-dependency-path: |
            DivKit/backend/**/*.gradle*
            DivKit/backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests
        run: ./gradlew test --no-daemon
