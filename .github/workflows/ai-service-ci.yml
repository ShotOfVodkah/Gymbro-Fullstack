name: AI Service CI

on:
  push:
    paths:
      - 'Backend/services/ai_service/**'
  pull_request:

jobs:
  test:
    name: Python tests — ai_service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/services/ai_service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v
