
name: iOS snapshot tests

on:
  push:
    paths:
      - "iOS/Gymbro/**"
      - ".github/workflows/ios-snapshot-ci.yml"
  pull_request:
    paths:
      - "iOS/Gymbro/**"
      - ".github/workflows/ios-snapshot-ci.yml"

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: |
          set -euo pipefail
          brew tap tuist/tuist
          brew install tuist

      - name: Generate and test
        working-directory: iOS/Gymbro
        run: |
          set -euo pipefail
          tuist install
          tuist generate --no-open
          xcodebuild \
            -workspace Gymbro.xcworkspace \
            -scheme GymbroWorkouts \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            -only-testing:GymbroWorkoutsTests \
            test
